[package]
name = "jmmp-moq"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
moq-relay = { version = "0.17.2", default-features = false, features = ["noq", "websocket"] }
moq-audio = { version = "0.1.10", default-features = false }
moq-net = "0.3.10"
moq-mux = "0.10.11"

[[bin]]
name = "jmmp-moq"
path = "src/main.rs"
